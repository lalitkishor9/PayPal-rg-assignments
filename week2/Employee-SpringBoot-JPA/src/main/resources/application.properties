spring.application.name=Employee-SpringBoot-JPA
# H2 Database Configuration (in-memory for quick testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate Properties
# 'update' will create/update tables based on your entities automatically.
# In production, use 'none' and proper migration tools (like Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Log SQL queries to console
spring.jpa.show-sql=true

# Format SQL queries nicely
spring.jpa.properties.hibernate.format_sql=true

# Server Port (optional, default is 8080)
server.port=8080